<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кот-утешитель 🐱</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #1e1e2f;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    width: 360px;
    background: #2a2a40;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    text-align: center;
}

.cat {
    width: 120px;
    margin-bottom: 10px;
}

h1 {
    margin: 10px 0;
    font-size: 20px;
}

textarea {
    width: 100%;
    height: 80px;
    border-radius: 10px;
    border: none;
    padding: 10px;
    margin-top: 10px;
    resize: none;
}

button {
    margin-top: 10px;
    padding: 10px;
    width: 100%;
    border: none;
    border-radius: 10px;
    background: #ff6b6b;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #ff4b4b;
}

.answer {
    margin-top: 15px;
    background: #1e1e2f;
    padding: 10px;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">

<img class="cat" src="{{ url_for('static', filename='cat.png') }}">

<h1>{{ greeting }}</h1>

<form method="POST">
    <textarea name="user_text" placeholder="Пожалуйся коту..."></textarea>

    <button name="action" value="complain">Пожаловаться</button>
    <button name="action" value="leave">Уйти</button>
</form>

{% if cat_answer %}
<div class="answer">
    {{ cat_answer }}
</div>
{% endif %}

{% if goodbye %}
<div class="answer">
    Кот посмотрел тебе вслед. Осуждающе.
</div>
{% endif %}

</div>

</body>
</html>
